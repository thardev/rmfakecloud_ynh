# Please refer to https://ddvk.github.io/rmfakecloud/install/configuration manual to tweak these values

JWT_SECRET_KEY=__JWT_KEY__
STORAGE_URL=https://__DOMAIN__
PORT=__PORT__
DATADIR=__DATA_DIR__
LOGLEVEL=info
RM_LOGFILE=/var/log/__APP__/__APP__.log
RM_HTTPS_COOKIE=true
RM_TRUST_PROXY=true
HASH_SCHEMA_VERSION=3

# Handwriting recognition options. To use the handwriting recognition feature, you need first to create a free account on https://developer.myscript.com/ (up to 2000 free recognitions per month).
RMAPI_HWR_APPLICATIONKEY=
RMAPI_HWR_HMAC=
RMAPI_HWR_LANG_OVERRIDE=
RMAPI_HWR_HOST=

# Email settings
RM_SMTP_SERVER=__DOMAIN__
RM_SMTP_USERNAME=__APP__
RM_SMTP_PASSWORD=__MAIL_PWD__
RM_SMTP_FROM=__APP__@__DOMAIN__
RM_SMTP_HELO=
RM_SMTP_NOTLS=true
RM_SMTP_STARTTLS=587
RM_SMTP_INSECURE_TLS=

# Screen sharing
ICE_SERVERS=[{"urls":["stun:stun.l.google.com:19302"]}]
MQTT_PORT=8883
TLS_CERT=
TLS_KEY=